<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CaisMed | Agendamentos</title>
  <meta name="description" content="CaisMed: agende consultas, faça a triagem e acompanhe seu plano de saúde." />
  <meta name="theme-color" content="#132C77" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CaisMed" />
  <script>(function(){try{var t=localStorage.getItem("tema"),f=localStorage.getItem("fonte");document.documentElement.setAttribute("data-tema",t==="escuro"||t==="preto"?"escuro":"claro");document.documentElement.setAttribute("data-fonte",f==="grande"?"grande":"normal")}catch(e){document.documentElement.setAttribute("data-tema","claro")}})()</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-perfil="administrador" data-layout="app" data-voltar="admin.html">
  <div class="app" id="app">
    <main class="app-body" id="main" tabindex="-1">
      <h1 class="intro-text left">Agendamentos</h1>
      <div class="toolbar">
        <form class="filtros" id="filtros" role="search" aria-label="Filtrar agendamentos">
          <div class="search"><span class="sr-only"></span><label class="sr-only" for="f-busca">Buscar</label><input type="search" id="f-busca" name="busca" placeholder="Paciente, profissional ou protocolo" autocomplete="off" /></div>
          <div class="filtro"><label class="sr-only" for="f-status">Status</label><select id="f-status" name="status"><option value="">Status: Todos</option><option value="agendado">Agendadas</option><option value="concluido">Concluídas</option><option value="cancelado">Canceladas</option></select></div>
          <div class="filtro"><label class="sr-only" for="f-clinica">Clínica</label><select id="f-clinica" name="clinicaId"><option value="">Clínica: Todas</option></select></div>
          <div class="filtro"><label class="sr-only" for="f-data">A Partir da Data</label><input type="date" id="f-data" name="de" title="A partir da data" /></div>
        </form>
      </div>
      <p class="contagem" id="contagem" aria-live="polite"></p>
      <div class="card-list" id="lista"></div>
    </main>
  </div>
  <noscript><p style="padding:1rem;text-align:center">Ative o JavaScript para usar o CaisMed.</p></noscript>
  <script type="module" src="js/pages/admin-agendamentos.js"></script>
</body>
</html>
