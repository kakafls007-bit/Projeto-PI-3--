<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CaisMed | Início</title>
  <meta name="description" content="CaisMed: agende consultas, faça a triagem e acompanhe seu plano de saúde." />
  <meta name="theme-color" content="#132C77" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CaisMed" />
  <script>(function(){try{var t=localStorage.getItem("tema"),f=localStorage.getItem("fonte");document.documentElement.setAttribute("data-tema",t==="escuro"||t==="preto"?"escuro":"claro");document.documentElement.setAttribute("data-fonte",f==="grande"?"grande":"normal")}catch(e){document.documentElement.setAttribute("data-tema","claro")}})()</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-perfil="paciente" data-layout="app">
  <div class="app" id="app">
    <main class="app-body" id="main" tabindex="-1">
      <p class="saudacao">Olá, <b id="saud-nome"></b>!</p>
      <h1 class="intro-text left">Como Podemos Ajudar Hoje?</h1>
      <section id="proxima" aria-label="Sua próxima consulta"></section>
      <div class="tile-grid">
        <a class="tile t-main" href="triagem.html"><span class="tile-ico" id="ico-triagem"></span><span class="tile-small">Conversar</span><span class="tile-title">Triagem</span></a>
        <a class="tile t-pale" href="agendamento.html"><span class="tile-ico" id="ico-agendar"></span><span class="tile-small">Agendar</span><span class="tile-title">Consultas</span></a>
        <a class="tile t-pale" href="consultas.html"><span class="tile-ico" id="ico-minhas"></span><span class="tile-small">Acompanhar</span><span class="tile-title">Minhas Consultas</span></a>
        <a class="tile t-ice" href="pagamento.html"><span class="tile-ico" id="ico-pagar"></span><span class="tile-small">Pagar</span><span class="tile-title">Pagamentos</span></a>
      </div>
      <h2 class="sec-title">Agendar Por Especialidade</h2>
      <div class="mini-row" id="mini-esp"></div>
      <a class="banner" href="carteirinha.html">
        <span><b>Sua Carteirinha Digital</b><small>Tenha seu cartão do plano sempre à mão.</small></span>
        <span class="banner-btn">Ver Cartão</span>
      </a>
    </main>
  </div>
  <noscript><p style="padding:1rem;text-align:center">Ative o JavaScript para usar o CaisMed.</p></noscript>
  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
