<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CaisMed | Editar Dados</title>
  <meta name="description" content="CaisMed: agende consultas, faça a triagem e acompanhe seu plano de saúde." />
  <meta name="theme-color" content="#132C77" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CaisMed" />
  <script>(function(){try{var t=localStorage.getItem("tema"),f=localStorage.getItem("fonte");document.documentElement.setAttribute("data-tema",t==="escuro"||t==="preto"?"escuro":"claro");document.documentElement.setAttribute("data-fonte",f==="grande"?"grande":"normal")}catch(e){document.documentElement.setAttribute("data-tema","claro")}})()</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-perfil="paciente" data-layout="app" data-voltar="perfil.html">
  <div class="app" id="app">
    <main class="app-body" id="main" tabindex="-1">
      <h1 class="intro-text left">Editar Dados</h1>
      <form id="perfil-editar-form">
        <div class="form-grid">
          <div class="field full"><label for="nome">Nome Completo <span class="req" aria-hidden="true">*</span></label><input id="nome" name="nome" autocomplete="name" required /></div>
          <div class="field"><label for="cpf">CPF</label><input id="cpf" name="cpf" inputmode="numeric" maxlength="11" disabled aria-describedby="cpf-ajuda" /><small class="ajuda" id="cpf-ajuda">O CPF só pode ser alterado pela clínica.</small></div>
          <div class="field"><label for="nascimento">Data de Nascimento</label><input id="nascimento" name="nascimento" type="date" autocomplete="bday" /></div>
          <div class="field"><label for="telefone">Telefone <span class="req" aria-hidden="true">*</span></label><input id="telefone" name="telefone" type="tel" autocomplete="tel" required /></div>
          <div class="field"><label for="email">E-mail <span class="req" aria-hidden="true">*</span></label><input id="email" name="email" type="email" autocomplete="email" required /></div>
          <div class="field"><label for="cidade">Cidade <span class="req" aria-hidden="true">*</span></label><input id="cidade" name="cidade" autocomplete="address-level2" required /></div>
          <div class="field"><label for="plano">Plano</label><select id="plano" name="plano"></select></div>
        </div>
        <p class="erro-form" id="erro" role="alert" hidden></p>
        <div class="bottom-area">
          <button type="submit" class="btn">Salvar Alterações</button>
          <button type="button" class="danger-link" id="btn-excluir">Excluir Minha Conta</button>
        </div>
      </form>
    </main>
  </div>
  <noscript><p style="padding:1rem;text-align:center">Ative o JavaScript para usar o CaisMed.</p></noscript>
  <script type="module" src="js/pages/perfil-editar.js"></script>
</body>
</html>
