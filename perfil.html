<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CaisMed | Perfil</title>
  <meta name="description" content="CaisMed: agende consultas, faça a triagem e acompanhe seu plano de saúde." />
  <meta name="theme-color" content="#132C77" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CaisMed" />
  <script>(function(){try{var t=localStorage.getItem("tema"),f=localStorage.getItem("fonte");document.documentElement.setAttribute("data-tema",t==="escuro"||t==="preto"?"escuro":"claro");document.documentElement.setAttribute("data-fonte",f==="grande"?"grande":"normal")}catch(e){document.documentElement.setAttribute("data-tema","claro")}})()</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-perfil="paciente" data-layout="app" data-voltar="home.html">
  <div class="app" id="app">
    <main class="app-body" id="main" tabindex="-1">
      <h1 class="intro-text left">Seus Dados</h1>
      <div class="info-list" id="perfil-info">
        <div class="info-row"><span class="label">Nome Completo</span><span class="value" id="info-nome">—</span></div>
        <div class="info-row"><span class="label">CPF</span><span class="value" id="info-cpf">—</span></div>
        <div class="info-row"><span class="label">Data de Nascimento</span><span class="value" id="info-nascimento">—</span></div>
        <div class="info-row"><span class="label">Telefone</span><span class="value" id="info-telefone">—</span></div>
        <div class="info-row"><span class="label">E-mail</span><span class="value" id="info-email">—</span></div>
        <div class="info-row"><span class="label">Cidade</span><span class="value" id="info-cidade">—</span></div>
        <div class="info-row"><span class="label">Plano</span><span class="value" id="info-plano">—</span></div>
      </div>
      <div class="bottom-area">
        <a href="perfil-editar.html" class="btn">Editar Dados</a>
        <button type="button" class="logout-link btn-outline" data-sair>Sair da Conta</button>
      </div>
    </main>
  </div>
  <noscript><p style="padding:1rem;text-align:center">Ative o JavaScript para usar o CaisMed.</p></noscript>
  <script type="module" src="js/pages/perfil.js"></script>
</body>
</html>
